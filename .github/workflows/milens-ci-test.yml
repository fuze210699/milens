name: Milens CI Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run lint

      - run: npm test -- --coverage

      - name: Coverage threshold
        run: |
          COV=$(node -e "const j=require('./coverage/coverage-summary.json'); process.stdout.write(String(Math.round(j.total.lines.pct)))")
          echo "Coverage: ${COV}%"
          if [ "$COV" -lt 50 ]; then echo "Coverage below 50%"; exit 1; fi
