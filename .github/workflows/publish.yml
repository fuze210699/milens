name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: node scripts/check-console.mjs
      - run: npm test
      # Build and smoke test
      - run: npm run build
      - run: node dist/cli.js analyze -p . --force
      - run: node scripts/smoke-test.mjs
      # Auto-update docs
      - run: node scripts/update-docs.js
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
