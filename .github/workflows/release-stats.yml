name: Release Stats
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build

      - name: Analyze repo
        run: node dist/cli.js analyze -p . --force

      - name: Update docs HTML with current stats
        run: node scripts/update-docs.js

      - name: Generate release-stats.json
        run: |
          node -e "
          const { Database } = await import('./dist/store/db.js');
          const { readFileSync, writeFileSync } = await import('node:fs');
          const { resolve } = await import('node:path');

          const db = new Database(resolve('.milens/milens.db'));
          const summary = db.getCodebaseSummary();
          const pkg = JSON.parse(readFileSync('package.json', 'utf-8'));

          const stats = {
            version: pkg.version,
            generatedAt: new Date().toISOString(),
            symbols: summary.symbols,
            links: summary.links,
            files: summary.files,
            coveragePct: summary.coveragePct,
            domains: summary.domains.length,
            topHubs: summary.topHubs.slice(0, 10).map(h => ({
              name: h.name,
              kind: h.kind,
              file: h.filePath,
              heat: h.heat
            }))
          };

          writeFileSync('release-stats.json', JSON.stringify(stats, null, 2));
          console.log('release-stats.json generated:', JSON.stringify(stats));
          "

      - name: Upload release stats artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-stats
          path: release-stats.json
          retention-days: 90
