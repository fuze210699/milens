name: Release Stats
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm run build

      - name: Analyze repo
        run: node dist/cli.js analyze -p . --force

      - name: Update docs HTML with current stats
        run: node scripts/update-docs.js

      - name: Generate release-stats.json
        run: node scripts/generate-release-stats.js

      - name: Upload release stats artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-stats
          path: release-stats.json
          retention-days: 90
