# git-cliff configuration — https://git-cliff.org
# Generates CHANGELOG.md from Conventional Commits, Keep a Changelog style.
# Fully offline: no GitHub API calls (PR links come from commit_preprocessors).

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/fuze210699/milens/compare/{{ release.previous.version }}...{{ release.version }}
        {% else -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/fuze210699/milens/releases/tag/{{ release.version }}
        {% endif -%}
    {% endif -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"

commit_preprocessors = [
    # Turn "(#123)" into a GitHub PR/issue link.
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/fuze210699/milens/issues/${2}))" },
]

commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Changed" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Testing" },
    { message = "^deprecate", group = "<!-- 6 -->Deprecated" },
    { message = "^revert", group = "<!-- 7 -->Reverted" },
    { body = ".*security", group = "<!-- 8 -->Security" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps\\)", skip = true },
    { message = "^chore", group = "<!-- 9 -->Miscellaneous" },
    { message = "^build", group = "<!-- 9 -->Miscellaneous" },
    { message = "^ci", skip = true },
    { message = "^v?[0-9]+\\.[0-9]+\\.[0-9]+", skip = true },
]
