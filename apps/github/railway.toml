# Railway deployment config for Milens GitHub App
# Docs: https://docs.railway.app

# You can also set these in Railway dashboard
# APP_ID=123456
# PRIVATE_KEY="-----BEGIN RSA PRIVATE KEY-----..."
# WEBHOOK_SECRET=your-random-secret

[build]
builder = "nixpacks"
buildCommand = "npm install && npm run verify"

[deploy]
startCommand = "npm start"
healthcheckPath = "/"
