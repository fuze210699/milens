name: Accuracy Parity Check
on: [push, pull_request]

jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        language: [ts, js, py, go, rust, java, php, ruby]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Analyze fixture project
        run: |
          PROJECT_ROOT="test/fixtures/accuracy/${{ matrix.language }}-project"
          npx milens analyze -p "$PROJECT_ROOT" --force

      - name: Run accuracy tests
        id: accuracy
        run: npx vitest run test/unit/accuracy.test.ts --reporter=json | tee accuracy-result.json
        continue-on-error: true

      - name: Enforce thresholds
        run: |
          if grep -q '"numFailedTests":0' accuracy-result.json; then
            echo "✅ All accuracy thresholds met for ${{ matrix.language }}"
          else
            echo "❌ Accuracy thresholds NOT met for ${{ matrix.language }}"
            cat accuracy-result.json
            exit 1
          fi
