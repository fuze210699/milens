name: "🐛 Bug Report"
description: Report something that doesn't work correctly
title: "[Bug] "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Report

        <!-- Replace everything in brackets [] with your info -->

        **Describe the bug**
        A clear and concise description of what the bug is.

        **To Reproduce**
        Steps to reproduce the behavior:
        1. Go to '...'
        2. Run '...'
        3. See error

        **Expected behavior**
        A clear description of what you expected to happen.

        **Environment**
        - milens version: `npx milens --version`
        - OS: [e.g. Ubuntu 22.04, Windows 11]
        - Node.js: `node --version`

        **Additional context**
        Any other context about the problem (screenshots, error logs, etc.)

        ---
        > ⚡ Use `/milens:debugger <symbol>` in an AI coding session to trace root cause automatically.
        > 📊 Run `milens security scan` to check for security-related bugs.

  - type: textarea
    id: reproduce
    attributes:
      label: "Reproduction steps"
      placeholder: "Exact steps to reproduce..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      placeholder: "What should happen..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
      placeholder: "What actually happens..."
    validations:
      required: true