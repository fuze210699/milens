name: Publish

# Triggered by branch, not by tag — a git tag isn't scoped to any branch, so a
# `push: tags: v*` trigger fires no matter which branch the tag was pushed
# from. Listening on `push: branches: [develop]` instead means feature/fix
# branches never touch this workflow at all: no run, no skip, nothing.
on:
  push:
    branches: [develop]
    paths:
      - 'package.json'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      # package.json can change on develop without a version bump (e.g. a
      # dependency edit) — only actually publish when the version differs
      # from what's already on npm.
      - name: Compare package.json version against npm
        id: check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view milens version 2>/dev/null || echo "0.0.0")
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT
          if [ "$PKG_VERSION" == "$PUBLISHED_VERSION" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "package.json version ($PKG_VERSION) already published — nothing to do."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "New version detected: $PUBLISHED_VERSION -> $PKG_VERSION"
          fi

  publish:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: node scripts/check-console.mjs
      - run: npm test
      # Fail fast if the Claude Code plugin manifest wasn't synced to this release's
      # version (npm's "version" lifecycle script should have done this — see
      # scripts/sync-version.mjs). A stale plugin.json ships a mismatched version.
      - name: Verify plugin manifest version matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PLUGIN_VERSION=$(node -p "require('./adapters/claude-code/.claude-plugin/plugin.json').version")
          if [ "$PKG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::plugin.json version ($PLUGIN_VERSION) != package.json version ($PKG_VERSION). Run 'npm run version' or 'node scripts/sync-version.mjs' and commit."
            exit 1
          fi
      # Build and smoke test
      - run: npm run build
      - run: node dist/cli.js analyze -p . --force
      # Phase 0.1: Generate release-stats artifact for downstream repos
      - name: Generate release stats
        run: node scripts/gen-release-stats.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-stats
          path: release-stats.json
      - run: node scripts/smoke-test.mjs
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # CI creates the tag itself now — guaranteed "v" prefix, no more manual
      # `git push --tags` step to get wrong.
      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ needs.check-version.outputs.version }}"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists locally, skipping tag creation."
          else
            git tag "$VERSION"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists on origin, skipping push."
          else
            git push origin "$VERSION"
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping."
          else
            gh release create "$VERSION" --generate-notes --title "$VERSION"
          fi
