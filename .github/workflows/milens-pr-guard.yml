name: Milens PR Guard
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  milens-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Coverage report
        run: npx vitest run --coverage

      - name: Security scan
        run: npx milens security scan -p . --scope secrets,data-leak --severity HIGH || true

      - name: Find dead code
        run: npx milens workflow refactor -p . || true

      - name: PR risk check
        run: npx milens workflow review -p . || true
