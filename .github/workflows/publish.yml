name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Tags aren't scoped to a branch — `push: tags: v*` fires no matter which
      # branch the tag was created on. Refuse to publish unless the tagged
      # commit has actually landed on develop or main, so a tag pushed from a
      # feature/fix branch (before it's merged) can't trigger a real release.
      - name: Verify tag is on develop or main
        run: |
          git fetch origin develop main --quiet 2>/dev/null || true
          if git merge-base --is-ancestor HEAD origin/develop 2>/dev/null; then
            echo "OK: ${{ github.ref_name }} is on develop"
          elif git merge-base --is-ancestor HEAD origin/main 2>/dev/null; then
            echo "OK: ${{ github.ref_name }} is on main"
          else
            echo "::error::${{ github.ref_name }} is not reachable from develop or main — refusing to publish from a feature/fix branch. Merge first, then tag from develop/main."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: node scripts/check-console.mjs
      - run: npm test
      # Fail fast if the Claude Code plugin manifest wasn't synced to this release's
      # version (npm's "version" lifecycle script should have done this — see
      # scripts/sync-version.mjs). A stale plugin.json ships a mismatched version.
      - name: Verify plugin manifest version matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PLUGIN_VERSION=$(node -p "require('./adapters/claude-code/.claude-plugin/plugin.json').version")
          if [ "$PKG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::plugin.json version ($PLUGIN_VERSION) != package.json version ($PKG_VERSION). Run 'npm run version' or 'node scripts/sync-version.mjs' and commit."
            exit 1
          fi
      # Build and smoke test
      - run: npm run build
      - run: node dist/cli.js analyze -p . --force
      # Phase 0.1: Generate release-stats artifact for downstream repos
      - name: Generate release stats
        run: node scripts/gen-release-stats.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-stats
          path: release-stats.json
      - run: node scripts/smoke-test.mjs
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
